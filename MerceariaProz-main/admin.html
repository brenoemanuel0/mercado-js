<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Proz - Adm</title>
    <link rel="stylesheet" href="assets/js/style.css">
</head>
<body>
    <header class="topo">
        <img class="logo" src="assets/js/padaria.png" alt="Logo da padaria">
        <div>
            <h1>Administrar Produtos</h1>
            <a href="index.html">inicio</a>
        </div>
    </header>

    <main>
        <form id="formCadastro">
            <div>
                <label for="nome">Nome do Produto</label>
                <input type="text" id="nome" required>
            </div>
            <div>
                <label for="preco">Preco do Produto</label>
                <input type="text" id="preco" required>
            </div>
            <div>
                <label for="categoria">Categoria do Produto</label>
                <input type="text" id="categoria" required>
            </div>
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>

        <table id="itens"> </table>
    </main>

    <script src="assets/js/scriptAdmin.js"></script>
</body>
</html>
